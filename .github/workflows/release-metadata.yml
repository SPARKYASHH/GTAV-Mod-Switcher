name: Update v0.1.1 release presentation
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-metadata.yml
      - docs/releases/v0.1.1.md
permissions:
  contents: read
jobs:
  latest:
    if: contains(github.event.head_commit.message, '[latest v0.1.1]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-v0.1.1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Mark the existing release as Latest without changing its files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.1.1" --jq '.id')
          if [ "$id" != '431360317' ]; then
            echo 'Unexpected release identity; no changes made.'
            exit 1
          fi
          gh release edit v0.1.1 --prerelease=false --latest \
            --title 'v0.1.1 — GTA V Mod Switcher' \
            --notes-file docs/releases/v0.1.1.md
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          test "$latest" = 'v0.1.1'
          gh release view v0.1.1 --json url,isPrerelease --jq '{url: .url, prerelease: .isPrerelease}'
