name: Windows tests and portable package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Parse all PowerShell sources
        shell: powershell
        run: |
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $parseTokens = $null; $parseErrors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$parseTokens,[ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: File operations on temporary folders - Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Core.Tests.ps1
      - name: File operations on temporary folders - PowerShell 7
        shell: pwsh
        run: .\tests\Core.Tests.ps1
      - name: Windows Forms smoke test
        shell: powershell
        run: .\ModSwitch.ps1 -SmokeTest -PreviewPath "${{ runner.temp }}\sparkyashh-interface.png"
      - name: Build GUI launcher
        shell: powershell
        run: .\Build-Launcher.ps1
      - name: Verify console-free launch and EXE shortcut
        shell: powershell
        run: .\tests\Launcher.Tests.ps1
      - name: Assemble portable package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force package
          Copy-Item 'GTA V Mod Switcher.exe',Launcher.cs,Launch-Worker.ps1,Build-Launcher.ps1,BUILD-LAUNCHER.cmd,ModSwitch.ps1,ModSwitch.Core.ps1,Theme.cs,START.cmd,RUN-TESTS.cmd,CREATE-SHORTCUT.cmd,Create-DesktopShortcut.ps1,README_RU.md,README.md,LICENSE,CHANGELOG.md -Destination package
          Copy-Item docs,tests,assets -Destination package -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: GTA-V-Mod-Switcher-by-SPARKYASHH-Windows-test-build
          path: package/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Interface-preview
          path: ${{ runner.temp }}/sparkyashh-interface.png
          if-no-files-found: error

  publish-preview:
    name: Publish v0.1.1 preview
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release v0.1.1]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-v0.1.1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GTA-V-Mod-Switcher-by-SPARKYASHH-Windows-test-build
          path: package
      - name: Package tested Windows build
        working-directory: package
        run: zip -q -r ../GTA-V-Mod-Switcher-v0.1.1-Windows.zip .
      - name: Compute checksum
        run: sha256sum GTA-V-Mod-Switcher-v0.1.1-Windows.zip > SHA256SUMS.txt
      - name: Publish preview after attaching verified package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=v0.1.1
          state=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [ "$state" = "false" ]; then
            echo 'This release is already public; refusing to overwrite it.'
            exit 1
          fi
          if [ "$state" != "true" ]; then
            gh release create "$tag" --draft --prerelease --target "$GITHUB_SHA" \
              --title 'GTA V Mod Switcher by SPARKYASHH — v0.1.1 Preview' \
              --notes-file docs/releases/v0.1.1.md
          fi
          gh release upload "$tag" GTA-V-Mod-Switcher-v0.1.1-Windows.zip SHA256SUMS.txt --clobber
          gh release edit "$tag" --draft=false
          gh release view "$tag" --json url --jq '.url'
